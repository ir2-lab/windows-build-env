# Pinned MSYS2 / UCRT64 build toolchain for OpenTRIM and its subprojects
# =====================================================================
#
# Snapshot source : ir2-lab/OpenTRIM CI run 27217912639
#                   (tag v1.1.6, 2026-06-09, msys2/setup-msys2 v2.31.1)
# Why this snapshot: last Windows build known-good before the GCC 16.2 /
#                   mingw-w64 headers r302 change that stopped leaking the
#                   non-standard `uint` typedef (broke OpenTRIM 1.2.0-test).
#
# This file is DATA ONLY. action.yml reads the package stems below and runs
# `pacman -U <base>/<stem>-any.pkg.tar.zst` for each. To bump the pin, edit
# only this file, run the smoke workflow, then move the version tag.
#
# NOTE ON REPRODUCIBILITY: packages are pulled live from repo.msys2.org, which
# is a rolling mirror. It currently keeps these superseded builds, but if MSYS2
# ever purges one the action will fail with a 404. Recovery options at that
# point: (a) bump to the nearest still-available older build, or (b) attach the
# .pkg.tar.zst files to a Release on this repo and point `package_base` at it.

# msys2/setup-msys2 commit to pin (tag v2.31.1). Keep in sync with action.yml.
setup_msys2_sha: e9898307ac31d1a803454791be09ab9973336e1c

# Base URL that package stems are resolved against.
package_base: https://repo.msys2.org/mingw/ucrt64

# Pinned packages. Stem = <name>-<version>-<pkgrel>; action appends -any.pkg.tar.zst.
packages:
