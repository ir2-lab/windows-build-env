name: 'Setup pinned MSYS2 UCRT64 toolchain'
description: >-
  Sets up MSYS2 (UCRT64) and installs the frozen OpenTRIM Windows build
  toolchain snapshot: GCC 16.1.0-5, binutils 2.46, Qt 5.15.19, HDF5 2.1.1,
  CMake 4.3.3, Ninja 1.13.2. Package set is defined in toolchain.yml.

inputs:
  extra-packages:
    description: >-
      Additional pacman package specs (space-separated) to install at their
      latest available version, after the pinned set. Use for things that are
      not toolchain-critical (e.g. project-specific helpers).
    required: false
    default: ''
  path-type:
    description: 'Passed through to msys2/setup-msys2 (inherit | minimal | strict).'
    required: false
    default: 'inherit'

runs:
  using: composite
  steps:
    - name: Set up MSYS2 (UCRT64)
      # Pinned to v2.31.1 — keep in sync with setup_msys2_sha in toolchain.yml
      uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c
      with:
        msystem: UCRT64
        update: false
        path-type: ${{ inputs.path-type }}
        install: >-
          base-devel
          git

    - name: Install pinned toolchain packages
      shell: msys2 {0}
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        set -euo pipefail

        action_dir="$(cygpath -u "$GITHUB_ACTION_PATH")"
        manifest="$action_dir/toolchain.yml"
        test -f "$manifest"

        base="$(grep -E '^package_base:[[:space:]]*' "$manifest" | awk '{print $2}')"
        test -n "$base"
        echo "package base: $base"

        urls=()
        while read -r stem; do
          [ -n "$stem" ] || continue
          urls+=("$base/${stem}-any.pkg.tar.zst")
        done < <(grep -oE 'mingw-w64-ucrt-x86_64-[^[:space:]]+' "$manifest")

        echo "pinned packages (${#urls[@]}):"
        printf '  %s\n' "${urls[@]}"

        # Refresh sync DBs so pacman can resolve the (unpinned) transitive deps
        # of the pinned packages without upgrading anything already installed.
        pacman -Sy --noconfirm

        # Single transaction: pacman orders the pinned packages itself and pulls
        # any missing deps (icu, harfbuzz, freetype, ...) at their latest version.
        pacman -U --needed --noconfirm "${urls[@]}"

        if [ -n "${EXTRA_PACKAGES// /}" ]; then
          echo "extra packages: $EXTRA_PACKAGES"
          pacman -S --needed --noconfirm $EXTRA_PACKAGES
        fi

    - name: Report installed toolchain
      shell: msys2 {0}
      run: |
        set -e
        gcc --version | head -1
        g++ --version | head -1
        cmake --version | head -1
        ninja --version
        qmake --version || true
        pacman -Q mingw-w64-ucrt-x86_64-gcc \
                  mingw-w64-ucrt-x86_64-binutils \
                  mingw-w64-ucrt-x86_64-qt5-base \
                  mingw-w64-ucrt-x86_64-hdf5
