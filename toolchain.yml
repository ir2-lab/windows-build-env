# Pinned MSYS2 / UCRT64 build toolchain for OpenTRIM and its subprojects
# =====================================================================
#
# Snapshot source : ir2-lab/OpenTRIM CI run 27217912639
#                   (tag v1.1.6, 2026-06-09, msys2/setup-msys2 v2.31.1)
# Why this snapshot: last Windows build known-good before GCC 16.2 /
#                   mingw-w64 headers r302 stopped leaking the non-standard
#                   `uint` typedef (broke OpenTRIM 1.2.0-test).
#
# This is the -COMPLETE- dependency closure that `pacman -S toolchain cmake ninja
# hdf5 qt5-base qt5-svg qwt-qt5 qt5-tools angleproject` resolved to in that run
# (the "Packages (100)" line in the job log), minus gdb/gdb-multiarch, plus
# eigen3. Everything is pinned so `pacman -U` installs a self-contained set with
# NO dependency left to float. A partial pin was tried first and failed: an
# unpinned newer `jsoncpp` broke the pinned CMake, and an unpinned newer
# `gcc-libgfortran` forced the pinned HDF5 to be skipped.
#
# This file is DATA ONLY. action.yml reads the package stems below and runs one
# `pacman -U <base>/<stem>-any.pkg.tar.zst` transaction. To bump the pin, replace
# the list from a newer known-good run's "Packages (N)" line, run the smoke
# workflow, then move the version tag.
#
# REPRODUCIBILITY: packages are pulled live from repo.msys2.org, a rolling
# mirror. All stems below were verified present on 2026-08-30. If MSYS2 ever
# purges one the action fails with a 404; recover by bumping to the nearest
# still-available build, or by attaching the .pkg.tar.zst files to a Release
# here and repointing `package_base`.

# msys2/setup-msys2 commit to pin (tag v2.31.1). Keep in sync with action.yml.
setup_msys2_sha: e9898307ac31d1a803454791be09ab9973336e1c

# Base URL that package stems resolve against.
package_base: https://repo.msys2.org/mingw/ucrt64

