name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned toolchain
        uses: ./

      - name: Assert every pinned package is installed at its pinned version
        run: |
          set -euo pipefail
          rc=0
          n=0
          # Each stem in toolchain.yml is <mingw-w64-ucrt-x86_64-NAME>-<VER>-<REL>.
          # MSYS2 pkgver never contains '-', so the last two '-' fields are VER, REL.
          while read -r stem; do
            [ -n "$stem" ] || continue
            n=$((n + 1))
            rest="${stem#mingw-w64-ucrt-x86_64-}"
            rel="${rest##*-}"; tmp="${rest%-*}"
            ver="${tmp##*-}"; name="${tmp%-*}"
            pkg="mingw-w64-ucrt-x86_64-${name}"
            want="${ver}-${rel}"
            got="$(pacman -Q "$pkg" 2>/dev/null | awk '{print $2}')" || true
            if [ -z "$got" ]; then
              echo "::error::$pkg not installed (expected $want)"; rc=1
            elif [ "$got" != "$want" ]; then
              echo "::error::$pkg is $got, expected $want (pin not taking effect)"; rc=1
            else
              echo "ok: $pkg $got"
            fi
          done < <(grep -oE 'mingw-w64-ucrt-x86_64-[^[:space:]]+' toolchain.yml)
          echo "checked $n pinned packages"
          exit $rc

      - name: Compile a trivial program
        run: |
          set -euo pipefail
          cat > hello.cpp <<'EOF'
          #include <cstdint>
          #include <iostream>
          int main() { std::uint32_t x = 42; std::cout << "ok " << x << "\n"; }
          EOF
          g++ -O2 -std=c++17 hello.cpp -o hello.exe
          ./hello.exe

      - name: Build a minimal CMake + Qt project
        run: |
          set -euo pipefail
          mkdir -p proj && cd proj
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(smoke LANGUAGES CXX)
          find_package(Qt5 COMPONENTS Core REQUIRED)
          add_executable(smoke main.cpp)
          target_link_libraries(smoke PRIVATE Qt5::Core)
          EOF
          cat > main.cpp <<'EOF'
          #include <QCoreApplication>
          #include <QDebug>
          int main(int argc, char** argv) {
            QCoreApplication a(argc, argv);
            qDebug() << "qt ok" << QT_VERSION_STR;
            return 0;
          }
          EOF
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/smoke.exe
